# Vokabulator – Apache configuration
#
# Serves the static build (copied by deploy/deploy.sh) and adds the one
# server-side piece the app needs: a tiny, locked-down reverse proxy to
# C.C.Buchner, because browsers may not fetch ccbuchner.de directly (CORS).
#
# Setup (once, as root):
#   a2enmod ssl proxy proxy_http headers
#   cp deploy/apache-vokabulator.conf /etc/apache2/sites-available/vokabulator.conf
#   # replace vokabeln.example.org and the paths below
#   a2ensite vokabulator && apachectl configtest && systemctl reload apache2
#
# Check:
#   curl -I https://vokabeln.example.org/proxy/ccbuchner/clip_code/40702-229/   -> 200
#   curl -I https://vokabeln.example.org/proxy/ccbuchner/agb/c-856              -> 403

<VirtualHost *:80>
	ServerName vokabeln.example.org
	Redirect permanent / https://vokabeln.example.org/
</VirtualHost>

<VirtualHost *:443>
	ServerName vokabeln.example.org
	DocumentRoot /var/www/vokabulator

	# HTTPS is required: camera (QR scan) and service worker (offline) only work in a secure context.
	SSLEngine on
	SSLCertificateFile    /etc/letsencrypt/live/vokabeln.example.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/vokabeln.example.org/privkey.pem

	# --- Static app -----------------------------------------------------------
	<Directory /var/www/vokabulator>
		Require all granted
		Options -Indexes
		AllowOverride None
		# Single-page app: every path without a file is answered by the app shell,
		# the root URL included (the service worker caches it from there).
		DirectoryIndex 200.html
		FallbackResource /200.html
	</Directory>

	# Hashed build files never change -> cache forever.
	<LocationMatch "^/_app/immutable/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
	# Entry points must always be revalidated, otherwise updates do not arrive.
	<FilesMatch "^(200\.html|service-worker\.js|manifest\.webmanifest)$">
		Header set Cache-Control "no-cache"
	</FilesMatch>

	# --- Proxy to C.C.Buchner (only two URL patterns, only GET) ---------------
	SSLProxyEngine on
	ProxyRequests Off
	# Do not pass the visitor's IP address on to the publisher.
	ProxyAddHeaders Off

	# 1) Mediencode landing page, e.g. /proxy/ccbuchner/clip_code/40702-229/
	ProxyPassMatch "^/proxy/ccbuchner/(clip_code/[0-9]+-[0-9]+/?)$" "https://www.ccbuchner.de/$1"
	# 2) Vocabulary PDF, e.g. /proxy/ccbuchner/_files_media/mediathek/downloads/26273.pdf
	ProxyPassMatch "^/proxy/ccbuchner/(_files_media/mediathek/downloads/[0-9]+\.pdf)$" "https://www.ccbuchner.de/$1"
	# Rewrite redirects from ccbuchner.de so they stay behind the proxy.
	ProxyPassReverse "/proxy/ccbuchner/" "https://www.ccbuchner.de/"
	ProxyPassReverse "/proxy/ccbuchner/" "https://ccbuchner.de/"

	# Everything under /proxy/ is forbidden ...
	<Location "/proxy/">
		Require all denied
	</Location>
	# ... except exactly the two patterns above (LocationMatch is evaluated after Location).
	<LocationMatch "^/proxy/ccbuchner/(clip_code/[0-9]+-[0-9]+/?|_files_media/mediathek/downloads/[0-9]+\.pdf)$">
		Require method GET HEAD
	</LocationMatch>
</VirtualHost>
