# Vokabulator – minimal Apache 2.4 virtual host
#
# Only what cannot live in .htaccess. All app rules (proxy to C.C.Buchner,
# single-page app, caching) are in static/.htaccess and are deployed with the app.
#
# Setup (once, as root):
#   a2enmod md ssl rewrite proxy proxy_http headers
#   cp deploy/apache-vhost.conf /etc/apache2/sites-available/vokabulator.conf
#   # adjust /var/www/vokabulator if your DocumentRoot is elsewhere
#   a2ensite vokabulator && apachectl configtest && systemctl reload apache2

# TLS certificate from Let's Encrypt via mod_md.
# (MDCertificateAgreement is needed once per server – skip it if already set elsewhere.)
MDCertificateAgreement accepted
MDomain vokabulator.thms.de

<VirtualHost *:80>
	ServerName vokabulator.thms.de
	Redirect permanent / https://vokabulator.thms.de/
</VirtualHost>

<VirtualHost *:443>
	ServerName vokabulator.thms.de
	SSLEngine on

	DocumentRoot /var/www/vokabulator
	<Directory /var/www/vokabulator>
		Require all granted
		# The app's rules come from .htaccess (deployed with the app).
		AllowOverride All
	</Directory>

	# Needed by the proxy rules in .htaccess (HTTPS to ccbuchner.de) – not allowed in .htaccess.
	SSLProxyEngine on
	# Do not pass the visitor's IP address on to the publisher – not allowed in .htaccess either.
	ProxyAddHeaders Off
	# ccbuchner.de only answers with the right TLS name (SNI www.ccbuchner.de) and only speaks TLS 1.2.
	# Set both explicitly, in case a global config says otherwise (ProxyPreserveHost On would send
	# vokabulator.thms.de as SNI → "AH00898: Error during SSL Handshake with remote server").
	ProxyPreserveHost Off
	SSLProxyProtocol -all +TLSv1.2 +TLSv1.3
</VirtualHost>
