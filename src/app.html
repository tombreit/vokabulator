<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#241a12" />
		<title>Vokabulator</title>
		<meta
			name="description"
			content="QR-Code im Schulbuch scannen und sofort loslegen: Vokabeln lernen mit XP, Leveln und Stufen bis zum Diamanten. Kostenlos, ohne Anmeldung, auch offline."
		/>
		<!-- Link preview when a Vokabulator link is shared (WhatsApp, Signal, Telegram, …).
		     Messengers do not run JavaScript, so every page shows this same card.
		     The image needs the full address – change the domain here if it moves.
		     static/og-image.png is drawn by scripts/make-og-image.mjs. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Vokabulator" />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:title" content="Vokabulator – Vokabeln scannen und spielend lernen" />
		<meta
			property="og:description"
			content="QR-Code im Schulbuch scannen und sofort loslegen: Vokabeln lernen mit XP, Leveln und Stufen bis zum Diamanten. Kostenlos, ohne Anmeldung, auch offline."
		/>
		<meta property="og:image" content="https://vokabulator.thms.de/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Der Schriftzug Vokabulator in Stein, darunter eine Leiste mit Stein, Kohle, Eisen, Gold und Diamant"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<!-- Installable app (PWA): name, icons and colors live in static/manifest.webmanifest.
		     Icons are in /app-icons/, not /icons/: Debian's Apache maps /icons/ to its own images. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/app-icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/app-icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
